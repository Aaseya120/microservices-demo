version: '3.9'

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:

services:

  # ── Infrastructure ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: micro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    networks:
      - microservices-net

  # ── Application services ─────────────────────────────
  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - service-registry
      - redis
    environment:
      EUREKA_URL: http://service-registry:8761/eureka/
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    networks:
      - microservices-net

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: micro
      DB_USER: postgres
      DB_PASS: postgres
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "8081:8081"
    networks:
      - microservices-net

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: micro
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "8083:8083"
    networks:
      - microservices-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: micro
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: micro
      DB_USER: postgres
      DB_PASS: postgres
      KAFKA_BROKERS: kafka:9092
      EUREKA_URL: http://service-registry:8761/eureka/
    ports:
      - "8084:8084"
    networks:
      - microservices-net
