spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:leapfrog}:${DB_PORT:5432}/${DB_NAME:micro}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 5
  batch:
    jdbc:
      initialize-schema: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    root: INFO
    com.demo: DEBUG
