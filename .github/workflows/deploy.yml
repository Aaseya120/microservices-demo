name: Build and Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 123456789.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: microservices-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build & Test
        run: mvn clean verify

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          # Extended from the guide's 4-service list to cover every module
          # in this reactor (adds service-registry + notification-service).
          for SERVICE in service-registry api-gateway user-service order-service product-service notification-service; do
            docker build -f $SERVICE/Dockerfile -t $ECR_REGISTRY/$SERVICE:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$SERVICE:$IMAGE_TAG
            docker tag $ECR_REGISTRY/$SERVICE:$IMAGE_TAG $ECR_REGISTRY/$SERVICE:latest
            docker push $ECR_REGISTRY/$SERVICE:latest
          done

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          kubectl set image deployment/order-service \
            order-service=$ECR_REGISTRY/order-service:$IMAGE_TAG \
            -n microservices
          kubectl rollout status deployment/order-service -n microservices
