eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, prometheus
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins:
      - "https://enterprise-frontend.com"
      - "http://localhost:3000"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
